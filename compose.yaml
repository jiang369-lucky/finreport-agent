name: finreport-agent-2025
services:
  db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finreport}
      POSTGRES_USER: ${POSTGRES_USER:-finagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts.configure_database first}
    ports:
      - "127.0.0.1:${FIN_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finagent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finreport}
      FIN_DATABASE_SCHEMA: ${FIN_DATABASE_SCHEMA:-finagent}
      FIN_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
